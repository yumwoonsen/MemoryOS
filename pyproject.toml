[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "garena-memoryos"
version = "0.2.0"
description = "Phase 1/2 AI Memory Engine prototype for Garena Next Chapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "openai",
  "pydantic>=2",
  "python-dotenv",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "ruff",
]

[project.scripts]
memoryos = "backend.run_memory:main"
memoryos-evaluate = "backend.evaluate:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
